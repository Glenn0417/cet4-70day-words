<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  :root{
    --bg:#0e1116; --panel:#161a22; --panel2:#1b2029; --line:#252b36;
    --tx:#e7ebf3; --tx2:#96a0b0; --tx3:#6b7482;
    --acc:#4ec9b0; --acc-d:#2f8f7c; --warn:#e2b349;
    --radius:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.55; padding-bottom:60px;
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 14px}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(14,17,22,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .hd{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
  .hd h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  .hd .sub{font-size:12px;color:var(--tx3);margin-left:auto;text-align:right;line-height:1.35}
  .bar{height:4px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:10px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#5aa9ff);transition:width .35s}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);
        border-radius:11px;padding:4px;margin:12px 0 10px}
  .tab{flex:1;background:transparent;border:none;color:var(--tx2);font-family:inherit;
       font-size:14px;padding:9px 8px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap}
  .tab.active{background:var(--panel);color:var(--tx)}
  .tab b{color:var(--warn);font-weight:600;margin-left:3px}

  /* ---------- day nav ---------- */
  .nav{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
  .btn{
    background:var(--panel2);color:var(--tx);border:1px solid var(--line);
    border-radius:10px;padding:9px 13px;font-size:14px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  .btn:hover{border-color:var(--acc-d);color:var(--acc)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:transparent}
  .btn.on{border-color:var(--acc-d);color:var(--acc);background:rgba(78,201,176,.08)}
  select{
    flex:1;background:var(--panel2);color:var(--tx);border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;font-size:14px;font-family:inherit;cursor:pointer;
    appearance:none;text-align:center;
  }
  .toolrow{display:flex;gap:8px;padding-bottom:12px;align-items:center;flex-wrap:wrap}
  input[type=search]{
    flex:1;min-width:140px;background:var(--panel2);color:var(--tx);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-size:14px;font-family:inherit;outline:none;
  }
  input[type=search]:focus{border-color:var(--acc-d)}

  /* ---------- meta ---------- */
  .meta{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 14px;margin-bottom:12px;font-size:13px;color:var(--tx2);
  }
  .meta b{color:var(--acc);font-weight:600}
  .meta .sp{margin-left:auto}
  .mini{height:5px;width:90px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .mini i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}

  /* ---------- table ---------- */
  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  thead th{
    text-align:left;font-size:12px;font-weight:600;color:var(--tx3);
    letter-spacing:.6px;padding:10px 12px;background:var(--panel2);
    border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer;transition:background .15s}
  tbody tr:hover{background:var(--panel2)}
  .col-n{width:34px;color:var(--tx3);font-size:12px;padding-top:13px}
  .col-w{width:146px}
  .col-pos{width:60px}
  .col-star{width:36px;text-align:center}
  .col-ck{width:38px;text-align:center}
  .w-en{font-weight:600;color:var(--tx);font-size:15.5px;letter-spacing:.2px}
  .w-ph{display:block;font-size:11.5px;color:var(--tx3);font-weight:400;letter-spacing:0;margin-top:2px;word-break:break-all}
  .pos{display:inline-block;font-size:11.5px;color:var(--acc);border:1px solid var(--acc-d);
       border-radius:5px;padding:1px 5px;line-height:1.5;white-space:nowrap}
  .cn{color:var(--tx)}
  .en{display:block;color:var(--tx2);font-size:12.5px;margin-top:3px;font-style:italic}
  .ck{
    width:20px;height:20px;border:1.5px solid #3a4453;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:transparent;
    transition:.15s;
  }
  tr.done .ck{background:var(--acc);border-color:var(--acc);color:#0e1116}
  tr.done .w-en{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--acc-d)}

  /* ---------- star / review ---------- */
  .star{
    display:inline-block;font-size:19px;line-height:1;cursor:pointer;
    color:#39424f;transition:color .15s,transform .12s;user-select:none;
  }
  .star:active{transform:scale(.85)}
  tr.rv .star{color:var(--warn)}

  /* ---------- word / phonetic / audio ---------- */
  .w-en{cursor:pointer;transition:color .15s}
  .w-en:hover{color:var(--acc)}
  tr.done .w-en{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--acc-d)}
  .w-ph{cursor:pointer;border-bottom:1px dashed transparent;transition:color .15s,border-color .15s}
  .w-ph:hover{color:var(--acc);border-bottom-color:var(--acc-d)}
  .w-ph:active{color:var(--acc)}
  tr.done .w-ph{color:var(--tx3);text-decoration:none}

  /* ---------- self-test mask ---------- */
  body.quiz .cn{
    color:transparent;
    background:linear-gradient(90deg,#2b3340,#232a35);
    border-radius:4px;
    user-select:none;
  }
  body.quiz .cn.reveal{color:var(--tx);background:none}
  body.quiz .en{visibility:hidden}
  body.quiz tr.done .cn{color:var(--tx3);background:none}
  body.quiz tr.done .en{visibility:visible}

  /* ---------- examples ---------- */
  tr.exrow,tr.exrow:hover{background:var(--panel2);cursor:default}
  tr.exrow td{padding:2px 12px 12px 12px;border-bottom:1px solid var(--line)}
  .exbox{border-left:2px solid var(--acc-d);padding:6px 0 0 12px}
  .exh{font-size:11px;color:var(--tx3);letter-spacing:.9px;margin:0 0 6px 0}
  .exline{font-size:13px;line-height:1.62;color:var(--tx);margin-bottom:9px}
  .exline:last-child{margin-bottom:2px}
  .exline .ec{display:block;color:var(--tx3);font-size:12.5px;margin-top:1px}
  .extag{display:inline-block;font-size:10.5px;color:var(--warn);
         border:1px solid rgba(226,179,73,.32);border-radius:4px;
         padding:0 5px;margin-left:7px;vertical-align:1.5px;white-space:nowrap}

  /* ---------- tip ---------- */
  .tip{
    margin-top:16px;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--warn);border-radius:var(--radius);
    padding:12px 14px;font-size:13px;color:var(--tx2);line-height:1.7;
  }
  .tip b{color:var(--warn)}

  /* ---------- misc ---------- */
  .hits{font-size:13px;color:var(--tx3);padding:8px 2px}
  .empty{padding:44px 16px;text-align:center;color:var(--tx3);font-size:14px;line-height:1.9}
  .empty b{color:var(--tx2)}
  [hidden]{display:none !important}

  /* ---------- mobile ---------- */
  @media (max-width:680px){
    body{font-size:14px}
    .wrap{padding:0 10px}
    table,thead,tbody,tr,td{display:block}
    thead{display:none}
    table{border:none;background:transparent;border-radius:0}
    tbody tr{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
      padding:11px 13px;margin-bottom:9px;position:relative;cursor:default;
    }
    tbody td{border:none;padding:0;display:block;width:auto !important}
    .col-n{position:absolute;top:11px;right:12px;font-size:11px;padding:0}
    .col-w{padding-right:34px;margin-bottom:4px}
    .col-pos{margin-bottom:5px}
    .col-cn{padding-right:82px}
    .col-star{position:absolute;bottom:6px;right:52px;padding:2px}
    .col-ck{position:absolute;bottom:9px;right:14px;padding:2px}
    .w-en{font-size:16px}
    .w-ph{font-size:12px;display:inline-block;padding:2px 0}
    tr.exrow{background:transparent;border:none;padding:0;margin:-9px 0 9px 0;position:static}
    tr.exrow td{padding:0 13px 12px 13px;border:none}
    .exline{padding-right:0}
    .exline{font-size:12.5px}
  }
</style>
</head>

const TOTAL_DAYS = 70;
const KEY_DONE = 'cet4_70';
const KEY_RV = 'cet4_70_review';
const KEY_LAST = 'cet4_70_last';

function readStore(k){
  try{ return JSON.parse(localStorage.getItem(k) || '{}') || {}; }catch(e){ return {}; }
}
function writeStore(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let done = readStore(KEY_DONE);
let review = readStore(KEY_RV);

const byDay = {};
const WORD_BY = {};
WORDS.forEach(w => {
  (byDay[w.d] = byDay[w.d] || []).push(w);
  WORD_BY[w.w] = w;
});

/* 自测模式：遮住释义，逼自己先回忆 */
let quiz = true;
try{ quiz = localStorage.getItem('cet4_quiz') !== '0'; }catch(e){}

let curDay = 1;
try{
  const last = parseInt(localStorage.getItem(KEY_LAST) || '1', 10);
  if (last >= 1 && last <= TOTAL_DAYS) curDay = last;
}catch(e){}

let view = 'daily';

/* ---------- elements ---------- */
const $ = id => document.getElementById(id);
const daySel = $('daySel');
const q = $('q');
const qReview = $('qReview');
const hostDaily = $('tableHost');
const hostRv = $('rvHost');

/* ---------- day select ---------- */
for (let i = 1; i <= TOTAL_DAYS; i++){
  const o = document.createElement('option');
  o.value = i;
  o.textContent = 'DAY ' + i + '  ·  ' + (byDay[i] || []).length + ' 词';
  daySel.appendChild(o);
}
daySel.value = curDay;

$('prevBtn').onclick = () => { if (curDay > 1){ curDay--; renderDaily(); } };
$('nextBtn').onclick = () => { if (curDay < TOTAL_DAYS){ curDay++; renderDaily(); } };
daySel.onchange = e => { curDay = parseInt(e.target.value, 10); renderDaily(); };
q.oninput = renderDaily;
qReview.oninput = renderReview;

$('topBtn').onclick = () => {
  q.value = ''; renderDaily();
  document.querySelector('.nav').scrollIntoView({ behavior:'smooth', block:'start' });
};

$('clearReview').onclick = () => {
  const n = rvCount();
  if (!n) return;
  if (!confirm('清空复习本里的 ' + n + ' 个词？')) return;
  review = {}; writeStore(KEY_RV, review);
  renderReview(); renderDaily(); paint();
};

$('tabDaily').onclick = () => switchView('daily');
$('tabReview').onclick = () => switchView('review');

function switchView(v){
  view = v;
  $('viewDaily').hidden = v !== 'daily';
  $('viewReview').hidden = v !== 'review';
  $('tabDaily').classList.toggle('active', v === 'daily');
  $('tabReview').classList.toggle('active', v === 'review');
  if (v === 'daily') renderDaily(); else renderReview();
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
const rvCount = () => Object.keys(review).length;
const doneCount = () => WORDS.filter(w => done[w.w]).length;

function paint(){
  const total = WORDS.length, d = doneCount(), r = rvCount();
  const pct = total ? d / total * 100 : 0;
  $('hdBar').style.width = pct.toFixed(1) + '%';
  $('hdSub').innerHTML = '已掌握 <b style="color:var(--acc)">' + d + '</b> / ' + total +
    '<br>总进度 ' + pct.toFixed(1) + '%';
  $('rvCount').textContent = r;
}

function rowsHtml(list){
  return list.map(w => {
    const en = w.en ? '<span class="en">' + esc(w.en) + '</span>' : '';
    const ph = w.p ? '<span class="w-ph" data-ph="1">' + esc(w.p) + '</span>' : '';
    const pos = w.pos ? '<span class="pos">' + esc(w.pos) + '</span>' : '';
    const isRv = !!review[w.w];
    return '<tr data-w="' + esc(w.w) + '" class="' + (done[w.w] ? 'done' : '') + (isRv ? ' rv' : '') + '">' +
      '<td class="col-n">' + esc(w.i || '') + '</td>' +
      '<td class="col-w"><span class="w-en" data-wd="1">' + esc(w.w) + '</span>' + ph + '</td>' +
      '<td class="col-pos">' + pos + '</td>' +
      '<td class="col-cn"><span class="cn">' + esc(w.cn) + '</span>' + en + '</td>' +
      '<td class="col-star"><span class="star" data-rv="1">' + (isRv ? '★' : '☆') + '</span></td>' +
      '<td class="col-ck"><span class="ck">✓</span></td>' +
      '</tr>';
  }).join('');
}

function toggleDone(tr, key){
  if (done[key]) delete done[key]; else done[key] = 1;
  writeStore(KEY_DONE, done);
  tr.classList.toggle('done', !!done[key]);
  paint();
  if (view === 'daily') renderDailyMeta(byDay[curDay] || [], false);
  else renderReviewMeta();
}

/* ---------- 发音（浏览器自带语音合成，不联网） ---------- */
let VOICE = null;
function pickVoice(){
  try{
    const vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    const en = vs.filter(v => /^en/i.test(v.lang));
    const rank = v => /en[-_]US/i.test(v.lang) ? 0 : (/en[-_]GB/i.test(v.lang) ? 1 : 2);
    en.sort((a, b) => rank(a) - rank(b));
    return en[0] || null;
  }catch(e){ return null; }
}
function speak(word){
  try{
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.85;
    if (!VOICE) VOICE = pickVoice();
    if (VOICE) u.voice = VOICE;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined){
  window.speechSynthesis.onvoiceschanged = () => { VOICE = pickVoice(); };
}

/* ---------- 例句 ---------- */
function exHtml(key){
  const w = WORD_BY[key] || {};
  const ex = w.ex || [], rx = w.rx || [];
  if (!ex.length && !rx.length){
    return '<div class="exbox"><div class="exline" style="color:var(--tx3)">词库里没收录这个词的例句</div></div>';
  }
  let h = '<div class="exbox">';
  if (ex.length){
    h += '<div class="exh">例句</div>';
    ex.forEach(e => {
      h += '<div class="exline">' + esc(e.s) +
           (e.c ? '<span class="ec">' + esc(e.c) + '</span>' : '') + '</div>';
    });
  }
  if (rx.length){
    h += '<div class="exh"' + (ex.length ? ' style="margin-top:9px"' : '') + '>四级真题</div>';
    rx.forEach(e => {
      h += '<div class="exline">' + esc(e.s) +
           (e.src ? '<span class="extag">' + esc(e.src) + '</span>' : '') + '</div>';
    });
  }
  return h + '</div>';
}

function toggleExamples(tr, key){
  const nx = tr.nextElementSibling;
  if (nx && nx.classList && nx.classList.contains('exrow')){
    nx.parentNode.removeChild(nx);
    return;
  }
  const row = document.createElement('tr');
  row.className = 'exrow';
  row.innerHTML = '<td colspan="6">' + exHtml(key) + '</td>';
  row.onclick = ev => ev.stopPropagation();
  tr.parentNode.insertBefore(row, tr.nextSibling);
}

/* ---------- 行内点击分流 ---------- */
function bindRows(host){
  host.querySelectorAll('tbody tr[data-w]').forEach(tr => {
    const key = tr.dataset.w;
    tr.onclick = (ev) => {
      const t = ev.target;

      // 星标 → 复习本
      if (t.dataset && t.dataset.rv){
        if (review[key]) delete review[key]; else review[key] = 1;
        writeStore(KEY_RV, review);
        tr.classList.toggle('rv', !!review[key]);
        t.textContent = review[key] ? '★' : '☆';
        paint();
        if (view === 'review') renderReview();
        return;
      }

      // 音标 → 只发音
      if (t.dataset && t.dataset.ph){ speak(key); return; }

      // 单词 → 发音 + 展开/收起例句
      if (t.dataset && t.dataset.wd){ speak(key); toggleExamples(tr, key); return; }

      // 自测模式下点释义 → 只揭示，不算掌握
      if (quiz && t.closest && t.closest('.col-cn')){
        const cn = t.closest('.col-cn').querySelector('.cn');
        if (cn) cn.classList.toggle('reveal');
        return;
      }

      // 其余区域 → 切换已掌握
      toggleDone(tr, key);
    };
  });
}

function tableHtml(list){
  return '<table><thead><tr><th>#</th><th>单词</th><th>词性</th><th>释义</th><th>☆</th><th>✓</th></tr></thead>' +
         '<tbody>' + rowsHtml(list) + '</tbody></table>';
}

/* ---------- daily ---------- */
function renderDailyMeta(list, isSearch){
  if (isSearch){
    $('meta').innerHTML = '搜索到 <b>' + list.length + '</b> 个词 <span class="sp"></span>';
    return;
  }
  const d = list.filter(w => done[w.w]).length;
  const pct = list.length ? Math.round(d / list.length * 100) : 0;
  $('meta').innerHTML = 'DAY <b>' + curDay + '</b> / 70' +
    '<span class="sp"></span>本日 <b>' + d + '/' + list.length + '</b>' +
    '<div class="mini"><i style="width:' + pct + '%"></i></div>' +
    '<span style="color:var(--tx3)">复习本 ' + rvCount() + '</span>';
}

function renderDaily(){
  const term = q.value.trim().toLowerCase();
  const isSearch = !!term;
  const list = isSearch
    ? WORDS.filter(w => w.w.toLowerCase().indexOf(term) >= 0 ||
                        (w.cn || '').toLowerCase().indexOf(term) >= 0 ||
                        (w.pos || '').toLowerCase().indexOf(term) >= 0).slice(0, 300)
    : (byDay[curDay] || []);

  document.querySelector('.nav').style.opacity = isSearch ? '.45' : '1';
  daySel.disabled = isSearch;
  $('prevBtn').disabled = isSearch;
  $('nextBtn').disabled = isSearch;

  if (!list.length){
    hostDaily.innerHTML = '<div class="empty">' + (isSearch ? '没找到匹配的词' : '本日无词') + '</div>';
  }else{
    hostDaily.innerHTML = (isSearch ? '<div class="hits">显示前 ' + list.length + ' 条匹配结果</div>' : '') +
      tableHtml(list);
    bindRows(hostDaily);
  }
  renderDailyMeta(list, isSearch);
  paint();
  try{ localStorage.setItem(KEY_LAST, String(curDay)); }catch(e){}
}

/* ---------- review ---------- */
function renderReviewMeta(){
  $('rvMeta').innerHTML = '复习本共 <b>' + rvCount() + '</b> 个词 <span class="sp"></span>' +
    '<span style="color:var(--tx3)">已掌握 ' + doneCount() + '/' + WORDS.length + '</span>';
}

function renderReview(){
  const term = qReview.value.trim().toLowerCase();
  let list = WORDS.filter(w => review[w.w]);
  if (term){
    list = list.filter(w => w.w.toLowerCase().indexOf(term) >= 0 ||
                            (w.cn || '').toLowerCase().indexOf(term) >= 0);
  }
  if (!list.length){
    hostRv.innerHTML = '<div class="empty">' +
      (term ? '复习本里没找到匹配的词'
            : '复习本还是空的。<br>在<b>今日词汇</b>里点单词右侧的 <b>☆</b>，把没记住的词丢进来。') +
      '</div>';
  }else{
    hostRv.innerHTML = tableHtml(list);
    bindRows(hostRv);
  }
  renderReviewMeta();
  paint();
}

/* ---------- 自测开关 ---------- */
function applyQuiz(){
  document.body.classList.toggle('quiz', quiz);
  const b = $('quizBtn');
  b.classList.toggle('on', quiz);
  b.textContent = quiz ? '自测 开' : '自测 关';
  b.title = quiz ? '已遮住释义，点释义可单独查看' : '点一下开启自测（遮住释义）';
}
$('quizBtn').onclick = () => {
  quiz = !quiz;
  try{ localStorage.setItem('cet4_quiz', quiz ? '1' : '0'); }catch(e){}
  applyQuiz();
};

/* ---------- boot ---------- */
applyQuiz();
switchView('daily');
</script>
