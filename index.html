<style>
  :root{
    --bg:#0e1116; --panel:#161a22; --panel2:#1b2029; --line:#252b36;
    --tx:#e7ebf3; --tx2:#96a0b0; --tx3:#6b7482;
    --acc:#4ec9b0; --acc-d:#2f8f7c; --warn:#e2b349;
    --radius:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.55; padding-bottom:60px;
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 14px}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(14,17,22,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .hd{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
  .hd h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  .hd .sub{font-size:12px;color:var(--tx3);margin-left:auto;text-align:right;line-height:1.3}
  .bar{height:4px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:10px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#5aa9ff);transition:width .35s}

  /* ---------- day nav ---------- */
  .nav{display:flex;align-items:center;gap:8px;padding:12px 0}
  .btn{
    background:var(--panel2);color:var(--tx);border:1px solid var(--line);
    border-radius:10px;padding:9px 13px;font-size:14px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  .btn:hover{border-color:var(--acc-d);color:var(--acc)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent}
  select{
    flex:1;background:var(--panel2);color:var(--tx);border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;font-size:14px;font-family:inherit;cursor:pointer;
    appearance:none;text-align:center;
  }
  .toolrow{display:flex;gap:8px;padding-bottom:12px;align-items:center;flex-wrap:wrap}
  input[type=search]{
    flex:1;min-width:150px;background:var(--panel2);color:var(--tx);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-size:14px;font-family:inherit;outline:none;
  }
  input[type=search]:focus{border-color:var(--acc-d)}

  /* ---------- meta ---------- */
  .meta{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 14px;margin-bottom:12px;font-size:13px;color:var(--tx2);
  }
  .meta b{color:var(--acc);font-weight:600}
  .meta .sp{margin-left:auto}
  .mini{height:5px;width:90px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .mini i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}

  /* ---------- table ---------- */
  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  thead th{
    text-align:left;font-size:12px;font-weight:600;color:var(--tx3);
    letter-spacing:.6px;padding:10px 12px;background:var(--panel2);
    border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer;transition:background .15s}
  tbody tr:hover{background:var(--panel2)}
  .col-n{width:38px;color:var(--tx3);font-size:12px;padding-top:13px}
  .col-w{width:150px}
  .col-pos{width:62px}
  .col-ck{width:40px;text-align:center}
  .w-en{font-weight:600;color:var(--tx);font-size:15.5px;letter-spacing:.2px}
  .w-ph{display:block;font-size:11.5px;color:var(--tx3);font-weight:400;letter-spacing:0;margin-top:2px;word-break:break-all}
  .pos{display:inline-block;font-size:11.5px;color:var(--acc);border:1px solid var(--acc-d);
       border-radius:5px;padding:1px 5px;line-height:1.5;white-space:nowrap}
  .cn{color:var(--tx)}
  .en{display:block;color:var(--tx2);font-size:12.5px;margin-top:3px;font-style:italic}
  .ck{
    width:20px;height:20px;border:1.5px solid #3a4453;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:transparent;
    transition:.15s;
  }
  tr.done .ck{background:var(--acc);border-color:var(--acc);color:#0e1116}
  tr.done .w-en{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--acc-d)}

  /* ---------- tip ---------- */
  .tip{
    margin-top:16px;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--warn);border-radius:var(--radius);
    padding:12px 14px;font-size:13px;color:var(--tx2);line-height:1.7;
  }
  .tip b{color:var(--warn)}

  /* ---------- search results ---------- */
  .hits{font-size:13px;color:var(--tx3);padding:8px 2px}
  .empty{padding:40px 0;text-align:center;color:var(--tx3);font-size:14px}

  /* ---------- mobile ---------- */
  @media (max-width:680px){
    body{font-size:14px}
    .wrap{padding:0 10px}
    table,thead,tbody,tr,td{display:block}
    thead{display:none}
    table{border:none;background:transparent;border-radius:0}
    tbody tr{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
      padding:11px 13px;margin-bottom:9px;position:relative;
    }
    tbody td{border:none;padding:0;display:block;width:auto !important}
    .col-n{position:absolute;top:11px;right:12px;font-size:11px;padding:0}
    .col-w{padding-right:34px;margin-bottom:4px}
    .col-pos{margin-bottom:5px}
    .col-ck{position:absolute;bottom:11px;right:12px}
    .w-en{font-size:16px}
    .w-ph{font-size:12px}
  }
</style>
</head>

/* ---------- init ---------- */
const TOTAL_DAYS = 70;
const store = (()=>{
  try{ return JSON.parse(localStorage.getItem('cet4_70')||'{}'); }catch(e){ return {}; }
})();
function save(){ try{ localStorage.setItem('cet4_70', JSON.stringify(store)); }catch(e){} }

const dayOf = w => w.d;
let byDay = {};
WORDS.forEach(w=>{ (byDay[w.d] = byDay[w.d]||[]).push(w); });

let curDay = 1;
try{
  const last = parseInt(localStorage.getItem('cet4_70_last')||'1',10);
  if(last>=1 && last<=TOTAL_DAYS) curDay = last;
}catch(e){}

/* ---------- controls ---------- */
const daySel = document.getElementById('daySel');
for(let i=1;i<=TOTAL_DAYS;i++){
  const o = document.createElement('option');
  o.value = i;
  const n = (byDay[i]||[]).length;
  o.textContent = 'DAY ' + i + '  ·  ' + n + ' 词';
  daySel.appendChild(o);
}
daySel.value = curDay;

document.getElementById('prevBtn').onclick = ()=>{ if(curDay>1){ curDay--; render(); } };
document.getElementById('nextBtn').onclick = ()=>{ if(curDay<TOTAL_DAYS){ curDay++; render(); } };
daySel.onchange = e => { curDay = parseInt(e.target.value,10); render(); };

const q = document.getElementById('q');
q.oninput = ()=> render();

document.getElementById('topBtn').onclick = ()=>{
  q.value=''; render();
  document.querySelector('.nav').scrollIntoView({behavior:'smooth',block:'start'});
};

/* ---------- render ---------- */
const host = document.getElementById('tableHost');

function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function masteredCount(list){
  return list.filter(w=>store[w.w]).length;
}

function renderMeta(list, isSearch){
  const meta = document.getElementById('meta');
  if(isSearch){
    meta.innerHTML = '搜索到 <b>'+list.length+'</b> 个词 <span class="sp"></span>';
    return;
  }
  const done = masteredCount(list);
  const pct = list.length ? Math.round(done/list.length*100) : 0;
  const allDone = totalDone();
  meta.innerHTML =
    'DAY <b>'+curDay+'</b> / 70' +
    '<span class="sp"></span>' +
    '本日 <b>'+done+'/'+list.length+'</b>' +
    '<div class="mini"><i style="width:'+pct+'%"></i></div>' +
    '<span style="color:var(--tx3)">全计划 '+allDone+'/'+WORDS.length+'</span>';
}

function totalDone(){
  return WORDS.filter(w=>store[w.w]).length;
}

function renderHeaderBar(){
  const d = totalDone();
  const pct = WORDS.length ? (d/WORDS.length*100) : 0;
  document.getElementById('hdBar').style.width = pct.toFixed(1)+'%';
  document.getElementById('hdSub').innerHTML =
    '已掌握 <b style="color:var(--acc)">'+d+'</b> / '+WORDS.length+' 词<br>'+
    '总进度 '+pct.toFixed(1)+'%';
}

function rowsHtml(list){
  return list.map(w=>{
    const i = w.i || '';
    const en = w.en ? '<span class="en">'+esc(w.en)+'</span>' : '';
    const ph = w.p ? '<span class="w-ph">'+esc(w.p)+'</span>' : '';
    const pos = w.pos ? '<span class="pos">'+esc(w.pos)+'</span>' : '';
    return '<tr data-w="'+esc(w.w)+'" class="'+(store[w.w]?'done':'')+'">'+
      '<td class="col-n">'+esc(i)+'</td>'+
      '<td class="col-w"><span class="w-en">'+esc(w.w)+'</span>'+ph+'</td>'+
      '<td class="col-pos">'+pos+'</td>'+
      '<td class="col-cn"><span class="cn">'+esc(w.cn)+'</span>'+en+'</td>'+
      '<td class="col-ck"><span class="ck">✓</span></td>'+
      '</tr>';
  }).join('');
}

function bindRows(){
  host.querySelectorAll('tbody tr').forEach(tr=>{
    tr.onclick = ()=>{
      const w = tr.dataset.w;
      if(store[w]) delete store[w]; else store[w] = 1;
      tr.classList.toggle('done', !!store[w]);
      save();
      if(!q.value.trim()) renderMeta(byDay[curDay]||[], false);
      renderHeaderBar();
    };
  });
}

function render(){
  const term = q.value.trim().toLowerCase();
  let list, isSearch = false;

  if(term){
    isSearch = true;
    list = WORDS.filter(w =>
      w.w.toLowerCase().includes(term) ||
      (w.cn||'').toLowerCase().includes(term) ||
      (w.pos||'').toLowerCase().includes(term)
    ).slice(0, 300);
    document.querySelector('.nav').style.opacity = '.45';
    daySel.disabled = true;
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
  }else{
    list = byDay[curDay] || [];
    document.querySelector('.nav').style.opacity = '1';
    daySel.disabled = false;
    document.getElementById('prevBtn').disabled = false;
    document.getElementById('nextBtn').disabled = false;
  }

  if(!list.length){
    host.innerHTML = '<div class="empty">'+(isSearch?'没找到匹配的词':'本日无词')+'</div>';
  }else{
    const head = '<table><thead><tr>'+
      '<th>#</th><th>单词</th><th>词性</th><th>释义</th><th>✓</th>'+
      '</tr></thead><tbody>'+rowsHtml(list)+'</tbody></table>';
    host.innerHTML = (isSearch ? '<div class="hits">显示前 '+list.length+' 条匹配结果</div>' : '') + head;
    bindRows();
  }

  renderMeta(list, isSearch);
  renderHeaderBar();
}

/* remember last visited day */
const _render = render;
render = function(){
  _render();
  try{ localStorage.setItem('cet4_70_last', String(curDay)); }catch(e){}
};
render();
</script>
